plugins {
    id 'java'
    id 'idea'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}
