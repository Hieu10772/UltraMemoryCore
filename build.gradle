plugins {
    id 'java'
}

version = project.property('mod_version')
group = project.property('mod_group')

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.terraformersmc.com/releases/' }
    maven { url 'https://maven.shedaniel.me/' }
}

dependencies {
    def mc = project.property('minecraft_version')

    minecraft "com.mojang:minecraft:${mc}"

    // Snapshot gần nhất có mappings công khai
    mappings "net.fabricmc:intermediary:25w46a:v2"

    modImplementation "net.fabricmc:fabric-loader:${project.property('loader_version')}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.property('fabric_version')}"

    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.property('cloth_config_version')}"
    modImplementation "com.terraformersmc:modmenu:${project.property('modmenu_version')}"

    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'it.unimi.dsi:fastutil:8.5.18'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand(
            version: project.version,
            minecraft_version: project.property('minecraft_version'),
            loader_version: project.property('loader_version')
        )
    }
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.name}" }
    }
}
