buildscript {
    repositories {
        maven { url 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        // Load Fabric Loom vào classpath cho toàn bộ dự án mà KHÔNG apply ở Root
        classpath 'net.fabricmc:fabric-loom:1.17.12'
    }
}

allprojects {
    repositories {
        mavenCentral()
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://maven.terraformersmc.com/releases/' }
        maven { url 'https://maven.shedaniel.me/' }
    }
}
