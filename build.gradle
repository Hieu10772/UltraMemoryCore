buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.cleanroommc.com' }
        maven { url = 'https://nexus.gtnewhorizons.com/repository/releases/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://plugins.gradle.org/m2/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
        classpath 'org.spongepowered:mixingradle:0.6-SNAPSHOT'
        
        classpath 'org.eclipse.platform:org.eclipse.core.runtime:3.17.100'
        classpath 'org.eclipse.platform:org.eclipse.equinox.common:3.10.800'
        classpath 'org.eclipse.platform:org.eclipse.jdt.core:3.18.0'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'org.spongepowered.mixin'

version = project.property("mod_version")
group = project.property("mod_group")
archivesBaseName = project.property("mod_id")

sourceCompatibility = targetCompatibility = '1.8'

compileJava {
    sourceCompatibility = targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
}

minecraft {
    version = "${project.minecraft_version}-${project.forge_version}"
    runDir = "run"
    mappings = project.mappings_version
}

configurations.all {
    resolutionStrategy {
        force 'org.eclipse.platform:org.eclipse.core.runtime:3.17.100'
        force 'org.eclipse.platform:org.eclipse.equinox.common:3.10.800'
        force 'org.eclipse.platform:org.eclipse.jdt.core:3.18.0'
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.cleanroommc.com' }
    maven { url = 'https://nexus.gtnewhorizons.com/repository/releases/' }
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://libraries.minecraft.net/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    compile "com.google.code.gson:gson:2.8.9"
    compile "it.unimi.dsi:fastutil:8.5.8"
    
    compile('org.spongepowered:mixin:0.8.5') {
        exclude module: 'launchwrapper'
        exclude module: 'guava'
        exclude module: 'gson'
        exclude module: 'commons-io'
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, "mixins.${project.property('mod_id')}.refmap.json"
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft_version

    filesMatching("mcmod.info") {
        expand "version": project.version, "mcversion": project.minecraft_version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude "mcmod.info"
    }
}

task runBenchmark(type: JavaExec) {
    group = "benchmark"
    description = "Runs the standalone UltraMemoryCore memory allocation benchmark."

    classpath = sourceSets.main.runtimeClasspath
    main = "com.example.ultramemorycore.util.MemoryBenchmark"
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
            'FMLCorePluginContainsFMLMod': 'true',
            'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker',
            'MixinConfigs': "mixins.${project.property('mod_id')}.json",
            'ForceLoadAsMod': 'true'
        )
    }
    from("LICENSE") {
        rename { "${it}_${project.name}" }
    }
}

tasks.matching { it.name.contains("Rangemap") }.all {
    enabled = false
}
