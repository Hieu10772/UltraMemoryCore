name: Build UltraMemoryCore

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên giao diện GitHub Web

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        # Cố định bản Gradle 8.12 ổn định (Tránh lỗi Gradle 9.x xung đột với Loom/Fabric)
        gradle-version: '8.12'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build --stacktrace

    - name: Upload Mod Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: ultramemorycore-jar
        path: build/libs/*.jar
