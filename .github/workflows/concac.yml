name: Copy root src into Fabric

on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: port-26.2
          fetch-depth: 0

      - name: Create Fabric target folder
        run: |
          mkdir -p Fabric/src/main/java

      - name: Copy root src/main/java into Fabric
        run: |
          if [ -d src/main/java ]; then
            echo "Copying root src/main/java -> Fabric/src/main/java"
            cp -r src/main/java/. Fabric/src/main/java/
          else
            echo "Root src/main/java not found"
          fi

      - name: Copy optional client sources into Fabric
        run: |
          if [ -d src/client/java ]; then
            echo "Copying src/client/java -> Fabric/src/main/java"
            cp -r src/client/java/. Fabric/src/main/java/
          else
            echo "No src/client/java folder"
          fi

      - name: Show copied files
        run: |
          echo "=== Fabric ==="
          find Fabric/src/main/java -type f | head -50 || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Fabric/src/main/java

          git diff --cached --quiet || git commit -m "Move root src into Fabric module"

          git push origin port-26.2
