name: Copy root src into modules

on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: port-26.2
          fetch-depth: 0

      - name: Create target folders
        run: |
          mkdir -p Common/src/main/java
          mkdir -p Fabric/src/main/java

      - name: Copy root src to Common
        run: |
          if [ -d src/main/java ]; then
            cp -r src/main/java/* Common/src/main/java/
          fi

      - name: Copy root client src to Fabric
        run: |
          if [ -d src/client/java ]; then
            cp -r src/client/java/* Fabric/src/main/java/
          fi

      - name: Show copied files
        run: |
          echo "=== Common ==="
          find Common/src/main/java -type f | head -20 || true

          echo "=== Fabric ==="
          find Fabric/src/main/java -type f | head -20 || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Common/src/main/java Fabric/src/main/java

          git commit -m "Copy root src into Common and Fabric modules" || echo "No changes"

          git push origin port-26.2
