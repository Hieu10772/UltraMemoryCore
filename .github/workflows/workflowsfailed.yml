name: Dọn dẹp Workflow Lỗi

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  delete-failed:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Xóa triệt để tất cả các workflow run bị lỗi
        run: |
          REPO="${{ github.repository }}"
          echo "Bắt đầu tiến trình xóa toàn bộ workflow lỗi trong $REPO..."
          
          while true; do
            # Lấy 100 ID lỗi tiếp theo
            FAILED_RUNS=$(gh run list --repo "$REPO" --status failure --json databaseId --jq '.[] | .databaseId' --limit 100)
            
            # Kiểm tra nếu trống thì dừng vòng lặp
            if [ -z "$FAILED_RUNS" ] || [ "$FAILED_RUNS" = "[]" ]; then
              echo "Chúc mừng! Đã xóa sạch toàn bộ các workflow bị lỗi."
              break
            fi
            
            echo "Tìm thấy danh sách mới, đang tiến hành xóa..."
            for RUN_ID in $FAILED_RUNS; do
              echo "Đang xóa run ID: $RUN_ID"
              # ĐÃ SỬA: Bỏ tham số --yes
              gh run delete --repo "$REPO" "$RUN_ID"
            done
            
            echo "Đang nghỉ 2 giây trước khi quét đợt tiếp theo..."
            sleep 2
          done
          
          echo "Hoàn thành dọn dẹp triệt để!"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
