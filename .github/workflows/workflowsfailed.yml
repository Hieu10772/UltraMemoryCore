name: failed workflows

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  delete-failed:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Xóa tất cả các workflow run bị lỗi
        run: |
          REPO="${{ github.repository }}"
          echo "Đang tìm các workflow bị lỗi trong $REPO..."
          
          # ĐÃ SỬA: Thay '--status failed' thành '--status failure'
          FAILED_RUNS=$(gh run list --repo "$REPO" --status failure --json databaseId --jq '.[] | .databaseId' --limit 100)
          
          if [ -z "$FAILED_RUNS" ]; then
            echo "Không tìm thấy workflow nào bị lỗi."
            exit 0
          fi
          
          for RUN_ID in $FAILED_RUNS; do
            echo "Đang xóa run ID: $RUN_ID"
            gh run delete --repo "$REPO" "$RUN_ID"
          done
          
          echo "Hoàn thành dọn dẹp!"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
