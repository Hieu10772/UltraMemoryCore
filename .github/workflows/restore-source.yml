name: Restore source from 1.21.11

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: port-26.2
          fetch-depth: 0

      - name: Show current branch
        run: |
          git branch --show-current
          git branch -a

      - name: Restore source folders from 1.21.11
        run: |
          git checkout 1.21.11 -- Common/src/main/java
          git checkout 1.21.11 -- Fabric/src/main
          git checkout 1.21.11 -- src/main
          git checkout 1.21.11 -- src/client

      - name: Show restored files
        run: |
          echo "=== Common ==="
          find Common/src/main/java -type f | head -20 || true

          echo "=== Fabric ==="
          find Fabric/src/main -type f | head -20 || true

          echo "=== Root src ==="
          find src/main -type f | head -20 || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Common/src/main/java Fabric/src/main src/main src/client

          git commit -m "Restore source from 1.21.11 into port-26.2" || echo "No changes to commit"

          git push origin port-26.2
