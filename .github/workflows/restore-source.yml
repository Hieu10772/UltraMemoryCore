name: Restore source from 1.21.11

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: port-26.2
          fetch-depth: 0

      - name: Fetch source branch
        run: |
          git fetch origin 1.21.11

      - name: Restore source folders
        run: |
          git checkout origin/1.21.11 -- Common/src/main/java
          git checkout origin/1.21.11 -- Fabric/src/main
          git checkout origin/1.21.11 -- src/main
          git checkout origin/1.21.11 -- src/client

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Common/src/main/java Fabric/src/main src/main src/client

          git commit -m "Restore source from 1.21.11 into port-26.2" || echo "No changes to commit"

          git push origin port-26.2
