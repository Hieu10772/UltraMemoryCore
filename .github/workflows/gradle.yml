name: Copy source from 1.21.11

on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout target branch
        run: |
          git checkout 26.2

      - name: Copy files from 1.21.11
        run: |
          git checkout 1.21.11 -- Common/src/main/java
          git checkout 1.21.11 -- Fabric/src/main/java
          git checkout 1.21.11 -- Fabric/src/main/resources

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Restore source from 1.21.11" || echo "No changes"
          git push origin 26.2
