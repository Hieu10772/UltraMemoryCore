plugins {
    id 'ultramemorycore.loader-conventions'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.terraformersmc.com/releases/' }
    mavenCentral()
}

dependencies {
    // Nếu Gradle báo lỗi không tìm thấy modImplementation,
    // hãy dùng configurations.modImplementation hoặc thêm trực tiếp theo cú pháp chuẩn của Loom:
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    
    // Khai báo dependencies mod
    "modImplementation"("net.fabricmc:fabric-loader:${project.loader_version}")
    "modImplementation"("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")
    "modImplementation"("com.terraformersmc:modmenu:${project.modmenu_version}")

    // Liên kết module Common
    implementation project(path: ':Common', configuration: 'namedElements')
}

loom {
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('run')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('run')
        }
    }
}

compileJava {
    source(project(':Common').sourceSets.main.allJava)
}

processResources {
    from(project(':Common').sourceSets.main.resources)
}
