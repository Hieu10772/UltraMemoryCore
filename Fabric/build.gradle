plugins {
    id 'ultramemorycore.loader-conventions'
}

apply plugin: 'net.fabricmc.fabric-loom'

evaluationDependsOn(':Common')

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.terraformersmc.com/releases/' }
    mavenCentral()
}

// 1. Khai báo Minecraft & Common bên ngoài để Loom setup metadata ngay từ đầu
dependencies {
    minecraft "com.mojang:minecraft:26.2"
    implementation project(':Common')
}

// 2. Đưa các mod dependency của Fabric vào afterEvaluate để tránh lỗi 'modImplementation' missing
afterEvaluate {
    dependencies {
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
        modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
    }
}

loom {
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('run')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('run')
        }
    }
}

compileJava {
    source(project(':Common').sourceSets.main.allJava)
}

processResources {
    from(project(':Common').sourceSets.main.resources)
}
