```groovy
plugins {
    id 'ultramemorycore.loader-conventions'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.terraformersmc.com/releases/' }
    mavenCentral()
}

dependencies {
    minecraft group: 'com.mojang', name: 'minecraft', version: minecraft_version

    implementation group: 'net.fabricmc', name: 'fabric-loader', version: loader_version

    // Mod Menu
    compileOnly group: 'com.terraformersmc', name: 'modmenu', version: modmenu_version
    runtimeOnly group: 'com.terraformersmc', name: 'modmenu', version: modmenu_version

    implementation project(':Common')
}

loom {
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('run')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('run')
        }
    }
}

// Lấy source từ Common giống FerriteCore
compileJava {
    source(project(':Common').sourceSets.main.allSource)
}

processResources {
    from project(':Common').sourceSets.main.output.resourcesDir
    dependsOn project(':Common').processResources
}
```
