buildscript {
    repositories {
        maven { url 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        classpath 'net.fabricmc:fabric-loom:1.17-SNAPSHOT'
    }
}

apply plugin: 'java-library'
apply plugin: 'net.fabricmc.fabric-loom'

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.terraformersmc.com/releases/' }
    maven { url 'https://maven.shedaniel.me/' }
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    compileOnly "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    runtimeOnly "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"

    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    runtimeOnly "com.terraformersmc:modmenu:${modmenu_version}"

    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'it.unimi.dsi:fastutil:8.5.18'

    implementation project(':Common')
}

loom {
    runs {
        client {
            client()
            runDir 'run'
        }
        server {
            server()
            runDir 'run'
        }
    }
}
