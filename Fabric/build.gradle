plugins {
    id 'ultramemorycore.loader-conventions'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.terraformersmc.com/releases/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api-base:${fabric_version}"
    implementation "net.fabricmc.fabric-api:fabric-command-api-v2:${fabric_version}"
    implementation "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:${fabric_version}"
    implementation "net.fabricmc.fabric-api:fabric-networking-api-v1:${fabric_version}"

    // Mod Menu
    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    runtimeOnly "com.terraformersmc:modmenu:${modmenu_version}"

    implementation project(':Common')
}

loom {
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('run')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('run')
        }
    }
}

// Lấy source từ Common giống FerriteCore
compileJava {
    source(project(':Common').sourceSets.main.allSource)
}

processResources {
    from project(':Common').sourceSets.main.output.resourcesDir
    dependsOn project(':Common').processResources
}
