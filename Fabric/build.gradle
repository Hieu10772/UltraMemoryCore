plugins {
    id 'ultramemorycore.loader-conventions'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft group: 'com.mojang', name: 'minecraft', version: minecraft_version

    mappings group: 'net.fabricmc', name: 'intermediary', version: "${minecraft_version}:v2"

    modImplementation group: 'net.fabricmc', name: 'fabric-loader', version: loader_version
    modImplementation group: 'net.fabricmc.fabric-api', name: 'fabric-api', version: fabric_version

    modImplementation group: 'me.shedaniel.cloth', name: 'cloth-config-fabric', version: cloth_config_version
    modImplementation group: 'com.terraformersmc', name: 'modmenu', version: modmenu_version

    implementation project(':Common')
}

loom {
    runs {
        client {
            client()
        }
        server {
            server()
        }
    }
}
