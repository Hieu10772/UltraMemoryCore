plugins {
    id 'ultramemorycore.loader-conventions'
}

buildscript {
    repositories {
        maven { url 'https://maven.fabricmc.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.fabricmc:fabric-loom:1.17-SNAPSHOT'
    }
}

apply plugin: 'ultramemorycore.loader-conventions'
apply plugin: 'net.fabricmc.fabric-loom'

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    // Snapshot mappings gần nhất có sẵn
    mappings "net.fabricmc:intermediary:25w46a:v2"

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    modImplementation "com.terraformersmc:modmenu:${modmenu_version}"

    implementation project(':Common')
}

loom {
    runs {
        client {
            client()
        }
        server {
            server()
        }
    }
}
