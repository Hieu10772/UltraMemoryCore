plugins {
    id 'ultramemorycore.loader-conventions'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.terraformersmc.com/releases/' }
    mavenCentral()
}

dependencies {
    minecraft group: 'com.mojang', name: 'minecraft', version: minecraft_version

    implementation group: 'net.fabricmc', name: 'fabric-loader', version: loader_version

    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'it.unimi.dsi:fastutil:8.5.18'

    compileOnly group: 'com.terraformersmc', name: 'modmenu', version: modmenu_version
    runtimeOnly group: 'com.terraformersmc', name: 'modmenu', version: modmenu_version

    implementation project(':Common')
}

loom {
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

def customGradle = project.file('custom.gradle')
if (customGradle.exists()) {
    apply from: customGradle
}
