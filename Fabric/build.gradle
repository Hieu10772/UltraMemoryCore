plugins {
    id 'ultramemorycore.loader-conventions'
}

apply plugin: 'net.fabricmc.fabric-loom'

evaluationDependsOn(':Common')

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.terraformersmc.com/releases/' }
    mavenCentral()
}

dependencies {
    // 1. Minecraft JAR
    minecraft "com.mojang:minecraft:26.2"

    // 2. Subproject Common
    implementation project(':Common')

    // 3. Thêm Fabric mod dependencies thông qua Configuration Name bằng phương thức add()
    // Cách này bypass việc gọi phương thức modImplementation() trực tiếp
    add('modImplementation', "net.fabricmc:fabric-loader:${project.loader_version}")
    add('modImplementation', "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")
    add('modImplementation', "com.terraformersmc:modmenu:${project.modmenu_version}")
}

loom {
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('run')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('run')
        }
    }
}

compileJava {
    source(project(':Common').sourceSets.main.allJava)
}

processResources {
    from(project(':Common').sourceSets.main.resources)
}
