plugins {
    id 'ultramemorycore.loader-conventions'
    id 'net.fabricmc.fabric-loom'
}

dependencies {
    minecraft group: 'com.mojang', name: 'minecraft', version: minecraft_version
    implementation group: 'net.fabricmc', name: 'fabric-loader', version: fabric_loader_version

    implementation project(':Common')
}

loom {
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

compileJava {
    source(project(':Common').sourceSets.main.allJava)
}

processResources {
    from(project(':Common').sourceSets.main.resources)
}

// Đúng đoạn code gọi custom.gradle của FerriteCore
def customGradle = project.file('custom.gradle')
if (customGradle.exists()) {
    apply from: customGradle
}
