plugins {
    id 'ultramemorycore.loader-conventions'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.terraformersmc.com/releases/' }
    mavenCentral()
}

dependencies {
    // 1. Minecraft & Fabric Loader
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // 2. Thêm Fabric API (Bắt buộc để giải quyết các import net.fabricmc.fabric.api.*)
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // 3. Thêm ModMenu (Bắt buộc để giải quyết các import com.terraformersmc.modmenu.api.*)
    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    // 4. Liên kết với module Common
    implementation project(path: ':Common', configuration: 'namedElements')
}

loom {
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('run')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('run')
        }
    }
}

compileJava {
    source(project(':Common').sourceSets.main.allJava)
}

processResources {
    from(project(':Common').sourceSets.main.resources)
}
