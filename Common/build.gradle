plugins {
    id 'net.fabricmc.fabric-loom'
}

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

loom {
    // Ép Loom tạo ra các variant (bao gồm namedElements / remapped) cho subproject khác dùng
    createRemappedVariants = true
}

// Đảm bảo các configuration chính của Common được xuất ra rõ ràng
configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:26.2"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
