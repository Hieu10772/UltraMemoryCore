plugins {
    // Dùng plugin ID mới dành cho các bản Minecraft không bị mã hóa (từ 26.1 trở lên)
    id 'net.fabricmc.fabric-loom' version '1.17.12'
}

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

dependencies {
    // Khai báo chính xác phiên bản Minecraft 26.2
    minecraft "com.mojang:minecraft:26.2"
    
    // Từ MC 26.1+ không cần cấu hình mappings (Yarn/Mojang) nữa vì game đã bỏ obfuscation!
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
