plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.12'
}

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

// BỔ SUNG CẤU HÌNH NÀY ĐỂ LOOM TẠO NAMED ELEMENTS FOR SUBPROJECTS
loom {
    // Nếu bạn không chạy Client/Server trực tiếp từ :Common
    // Dòng này giúp Loom tạo variant namedElements chuẩn cho :Fabric
    splitEnvironmentSourceSets() 
}

dependencies {
    minecraft "com.mojang:minecraft:26.2"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
